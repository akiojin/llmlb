version: 2

# Dependabot の件名は "<prefix>: bump the <group> group across 1 directory with <N> updates"。
# commitlint の header-max-length (72) を守るため、group 名は 9 文字以内にし、
# 1 group に束ねる更新数を用途別の分割で抑える（Issue #727）。
# group 内 1 件更新の件名は依存名で長さが決まるため、commitlint.config.js が
# "chore(deps): " で始まり Dependabot の署名を持つコミットを除外している（Issue #751）。
# 全エントリで commit-message.prefix を "chore(deps)" に揃え、除外条件と一致させること。
# 変更時は scripts/checks/check-dependabot-subjects.sh（make dependabot-subjects）で検証する。
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "submodule"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 型定義と TypeScript コンパイラ
      # dashboard は typescript を TS 6 API（typescript-eslint 用）に、
      # @typescript/native を TS 7 の tsc に割り当てている（Issue #769）
      npm-types:
        patterns:
          - "@types/*"
          - "typescript"
          - "@typescript/native"
      # ダッシュボードのランタイム依存
      npm-prod:
        dependency-type: "production"
      # ビルド・lint・テストなどの開発ツール
      npm-dev:
        dependency-type: "development"
      npm-sec:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns:
          - "*"
      cargo-sec:
        applies-to: "security-updates"
        patterns:
          - "*"
