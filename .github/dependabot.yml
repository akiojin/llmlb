version: 2

# Dependabot の件名は "<prefix>: bump the <group> group across 1 directory with <N> updates"。
# commitlint の header-max-length (72) を守るため、group 名は 9 文字以内にし、
# 1 group に束ねる更新数を用途別の分割で抑える（Issue #727）。
# 変更時は scripts/checks/check-dependabot-subjects.sh（make dependabot-subjects）で検証する。
updates:
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "submodule"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # 型定義と TypeScript コンパイラ
      npm-types:
        patterns:
          - "@types/*"
          - "typescript"
      # ダッシュボードのランタイム依存
      npm-prod:
        dependency-type: "production"
      # ビルド・lint・テストなどの開発ツール
      npm-dev:
        dependency-type: "development"
      npm-sec:
        applies-to: "security-updates"
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "develop"
    labels:
      - "dependencies"
      - "cargo"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo:
        patterns:
          - "*"
      cargo-sec:
        applies-to: "security-updates"
        patterns:
          - "*"
