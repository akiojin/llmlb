# Lint Workflow
# 機能ID: SPEC-47c6f44c (quality-checks.ymlから分離)
# 目的: コード品質チェック（フォーマット、lint、ドキュメント）
# 要件: FR-004 (Rust lint), FR-005 (commitlint), FR-006 (markdownlint)

name: Lint

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop

jobs:
  # パス変更検出（Rustジョブの条件付き実行用）
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'llmlb/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/lint.yml'
              - 'scripts/checks/check-module-structure.sh'
              - 'scripts/checks/module-structure-allowlist.txt'
              - 'scripts/checks/check-event-publishers.sh'
              - 'scripts/checks/event-publishers-allowlist.txt'

  rust-lint:
    # 要件: FR-004
    # 目的: Rust lintチェック（fmt, clippy）
    name: Rust Format & Clippy
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: No Rust-relevant changes
        if: needs.changes.outputs.rust != 'true'
        run: echo "No Rust-relevant changes; skipping Rust format/clippy."

      - name: Checkout code
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check module structure
        # SPEC #699 FR-009/FR-010, Issue #771: 1,500 行上限と mod.rs の re-export 化を
        # 必須チェックで強制する（pre-push のみだと上限超過が CI 緑のまま着地する）
        if: needs.changes.outputs.rust == 'true'
        run: make module-structure

      - name: Check event publishers
        # SPEC #582 FR-048e, Issue #781: canonical ダッシュボードイベントに production の publisher が
        # 無い状態を必須チェックで検出する（ポーリングで画面が更新されるため、欠落しても症状が出ない）
        if: needs.changes.outputs.rust == 'true'
        run: make event-publishers

      - name: Setup Rust
        if: needs.changes.outputs.rust == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy

      - name: Bootstrap pest_generator
        if: needs.changes.outputs.rust == 'true'
        run: |
          if [ -f vendor/pest_generator/bootstrap/Cargo.toml ]; then
            cargo build --manifest-path vendor/pest_generator/bootstrap/Cargo.toml
          else
            echo "Skipping pest_generator bootstrap: vendor/pest_generator/bootstrap/Cargo.toml not found"
          fi

      - name: Run cargo fmt
        if: needs.changes.outputs.rust == 'true'
        run: |
          echo "🎨 Checking Rust formatting..."
          cargo fmt --all -- --check

      - name: Run cargo clippy
        if: needs.changes.outputs.rust == 'true'
        run: |
          echo "🔍 Running Rust linter..."
          cargo clippy --all-targets --all-features -- -D warnings

  dashboard-lint:
    # Issue #769, #782
    # 目的: dashboard の typecheck / lint / コンポーネントテストの失敗を検出する（依存更新での破損を着地前に止める）
    # pnpm-lock.yaml 等ルートの変更でも壊れ得るため、パスフィルタを掛けず常に実行する
    name: Dashboard Typecheck, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vitest 5 は Node 22.12 以上を要求する
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck, lint & test dashboard
        run: make dashboard-checks

  markdownlint:
    # 要件: FR-006
    # 目的: マークダウンファイルのスタイル違反を検出
    name: Markdown Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Run markdownlint
        run: |
          echo "📄 Checking Markdown files..."
          pnpm dlx markdownlint-cli2 "**/*.md" "!node_modules" "!.git" "!.github" "!.worktrees" "!CHANGELOG.md"

  migration-versions:
    # Issue #737
    # 目的: 並行ブランチ間のマイグレーション番号衝突をマージ前に検出する
    name: Migration Version Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Install bats
        run: pnpm install --frozen-lockfile

      - name: Check migration versions
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: make migration-versions

      - name: Test migration version check
        run: make test-checks

  commitlint:
    # 要件: FR-005
    # 目的: コミットメッセージがConventional Commits準拠かチェック
    name: Commit Message Lint
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0

      - name: Install commitlint
        run: |
          echo "📦 Installing commitlint..."
          pnpm install --frozen-lockfile

      - name: Check commit messages
        run: |
          echo "📝 Checking commit messages..."
          echo "Base ref: ${{ github.base_ref }}"
          chmod +x scripts/checks/check-commits.sh
          scripts/checks/check-commits.sh --from "origin/${{ github.base_ref }}" --to HEAD

      - name: Check Dependabot group subjects
        # Issue #727: Dependabot のグループ更新件名が header-max-length を超えないことを保証する
        run: make dependabot-subjects

      - name: Check canonical mapping freshness
        # Issue #776: canonical テーブルの最終確認日が閾値（180 日）を超えたら落とす。
        # 時間経過だけで失効するため、パスフィルタのない必須ジョブ（全 PR で実行）に置く。
        # ネットワークには依存しない。
        run: make mapping-freshness
