openapi: 3.1.0
info:
  title: LLM Load Balancer API
  version: "0.1.0"
  description: >
    OpenAI-compatible endpoints with optional cloud routing by model prefix
    (openai:/google:/anthropic:).
servers:
  - url: http://localhost:32768
paths:
  /v1/messages:
    post:
      summary: Anthropic Messages API (local or Anthropic Cloud)
      parameters:
        - in: header
          name: x-api-key
          required: true
          schema:
            type: string
        - in: header
          name: anthropic-version
          required: true
          schema:
            type: string
        - in: header
          name: anthropic-beta
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnthropicMessageRequest"
      responses:
        "200":
          description: Anthropic message response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicMessageResponse"
            text/event-stream:
              schema:
                type: string
                description: Anthropic SSE stream
        "400":
          description: Invalid Anthropic request
        "401":
          description: Missing or invalid Anthropic-compatible auth header
        "403":
          description: Insufficient API key permission
  /v1/chat/completions:
    post:
      summary: Chat completion (local or cloud depending on model prefix)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
        "400":
          description: Invalid request or unsupported prefix
        "401":
          description: Missing or invalid cloud API key
  /v1/completions:
    post:
      summary: Text completion (legacy)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionRequest"
      responses:
        "200":
          description: Completion response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionResponse"
  /v1/embeddings:
    post:
      summary: Embeddings generation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbeddingRequest"
      responses:
        "200":
          description: Embedding vectors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbeddingResponse"
  /api/dashboard/stats:
    get:
      summary: LLM Load Balancer stats including cloud key presence flags
      responses:
        "200":
          description: Current stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /api/organizations:
    get:
      summary: List organizations visible to the current JWT account
      security: [{ dashboardSession: [] }, { dashboardBearer: [] }]
      responses:
        "200":
          description: Current authorized organizations; private, no-store
          content:
            application/json:
              schema:
                type: object
                required: [organizations]
                properties:
                  organizations:
                    type: array
                    items: { $ref: "#/components/schemas/Organization" }
        "403": { description: Active membership is required }
    post:
      summary: Create an organization (system administrator only)
      description: Cookie authentication also requires the existing CSRF header and same-origin checks.
      security: [{ dashboardSession: [] }, { dashboardBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationName" }
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Organization" }
        "400": { description: Empty or duplicate active name }
        "403": { description: System administrator required }
  /api/organizations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    patch:
      summary: Rename an organization (system administrator only)
      security: [{ dashboardSession: [] }, { dashboardBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrganizationName" }
      responses:
        "200": { description: Organization renamed }
        "400": { description: Invalid or duplicate active name }
        "403": { description: System administrator required }
        "404": { description: Organization not found }
    delete:
      summary: Archive an empty organization, retaining historical usage
      security: [{ dashboardSession: [] }, { dashboardBearer: [] }]
      responses:
        "204": { description: Organization archived }
        "400": { description: Organization still has assigned accounts }
        "403": { description: System administrator required }
        "404": { description: Organization not found }
  /api/organizations/{id}/members:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: List accounts within the current organization or own-account scope
      security: [{ dashboardSession: [] }, { dashboardBearer: [] }]
      responses:
        "200":
          description: Scoped accounts without password hashes; private, no-store
          content:
            application/json:
              schema:
                type: object
                properties:
                  users: { type: array, items: { type: object } }
        "403": { description: Active membership is required }
        "404": { description: Organization not found or outside the authorized scope }
  /api/users/{id}/membership:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Set single organization membership and organization role
      description: System administrator and cookie CSRF rules apply. Transfers revoke old attributed keys without rewriting historical usage.
      security: [{ dashboardSession: [] }, { dashboardBearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [organization_id, organization_role]
              additionalProperties: false
              properties:
                organization_id: { type: [string, "null"], format: uuid }
                organization_role: { type: string, enum: [admin, member] }
                is_active: { type: boolean }
      responses:
        "200": { description: Membership updated }
        "400": { description: Invalid membership or last active administrator protection }
        "403": { description: System administrator required }
        "404": { description: Account not found }
  /api/dashboard/usage:
    get:
      summary: Durable organization or account usage within the current JWT scope
      description: UTC receipt dates include both selected days. Unknown legacy attribution is global-only. Totals cover all matching rows before pagination.
      security: [{ dashboardSession: [] }, { dashboardBearer: [] }]
      parameters:
        - { in: query, name: group_by, schema: { type: string, enum: [organization, account], default: account } }
        - { in: query, name: from, schema: { type: string, format: date }, description: Defaults to the first day of the current UTC month }
        - { in: query, name: to, schema: { type: string, format: date }, description: Inclusive; defaults to the last day of the current UTC month }
        - { in: query, name: organization_id, schema: { type: string, format: uuid } }
        - { in: query, name: account_id, schema: { type: string, format: uuid } }
        - { in: query, name: page, schema: { type: integer, minimum: 1, default: 1 } }
        - { in: query, name: per_page, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: Authorized rows, full totals and observation coverage; private, no-store
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsagePage" }
        "400": { description: Invalid UTC interval or paging value }
        "401": { description: Missing or invalid JWT; API keys are not accepted }
        "403": { description: Requested filters exceed the current scope or active membership is absent }
components:
  securitySchemes:
    dashboardSession: { type: apiKey, in: cookie, name: llmlb_jwt }
    dashboardBearer: { type: http, scheme: bearer, bearerFormat: JWT }
  schemas:
    AnthropicMessageRequest:
      type: object
      properties:
        model:
          type: string
          example: anthropic:claude-3-7-sonnet
        max_tokens:
          type: integer
          minimum: 1
        system:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/AnthropicTextBlock"
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicInputMessage"
        temperature:
          type: number
        top_p:
          type: number
        stop_sequences:
          type: array
          items:
            type: string
        stream:
          type: boolean
      required: [model, max_tokens, messages]
    AnthropicInputMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          oneOf:
            - type: string
            - type: array
              items:
                $ref: "#/components/schemas/AnthropicTextBlock"
      required: [role, content]
    AnthropicTextBlock:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
      required: [type, text]
    AnthropicMessageResponse:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [message]
        role:
          type: string
          enum: [assistant]
        model:
          type: string
        content:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicTextBlock"
        stop_reason:
          type: [string, "null"]
        stop_sequence:
          type: [string, "null"]
        usage:
          type: object
          properties:
            input_tokens:
              type: integer
            output_tokens:
              type: integer
    ChatRequest:
      type: object
      properties:
        model:
          type: string
          example: openai:gpt-4o
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
        stream:
          type: boolean
      required: [model, messages]
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant]
        content:
          type: string
      required: [role, content]
    ChatResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            $ref: "#/components/schemas/ChatChoice"
    ChatChoice:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: "#/components/schemas/ChatMessage"
        finish_reason:
          type: string
    CompletionRequest:
      type: object
      properties:
        model:
          type: string
        prompt:
          type: string
        stream:
          type: boolean
      required: [model, prompt]
    CompletionResponse:
      type: object
      properties:
        id:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            properties:
              text:
                type: string
              index:
                type: integer
    EmbeddingRequest:
      type: object
      properties:
        model:
          type: string
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      required: [model, input]
    EmbeddingResponse:
      type: object
      properties:
        model:
          type: string
        data:
          type: array
          items:
            type: object
            properties:
              embedding:
                type: array
                items:
                  type: number
              index:
                type: integer
    DashboardStats:
      type: object
      properties:
        total_runtimes:
          type: integer
        online_runtimes:
          type: integer
        offline_runtimes:
          type: integer
        total_requests:
          type: integer
        successful_requests:
          type: integer
        failed_requests:
          type: integer
        total_active_requests:
          type: integer
        average_response_time_ms:
          type: [number, "null"]
        average_gpu_usage:
          type: [number, "null"]
        average_gpu_memory_usage:
          type: [number, "null"]
        last_metrics_updated_at:
          type: [string, "null"]
          format: date-time
        last_registered_at:
          type: [string, "null"]
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
        openai_key_present:
          type: boolean
        google_key_present:
          type: boolean
        anthropic_key_present:
          type: boolean

    OrganizationName:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, description: Trimmed non-empty name; active names must be unique }
    Organization:
      type: object
      required: [id, name, created_at, updated_at, archived_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        archived_at: { type: [string, "null"], format: date-time }
    UsageCounts:
      type: object
      required: [request_count, input_tokens, output_tokens, total_tokens, measured_requests, estimated_requests, missing_requests]
      properties:
        request_count: { type: integer, minimum: 0 }
        input_tokens: { type: integer, minimum: 0 }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        measured_requests: { type: integer, minimum: 0 }
        estimated_requests: { type: integer, minimum: 0 }
        missing_requests: { type: integer, minimum: 0, description: Includes partially missing token observations; missing values are not measured zero }
    UsageRow:
      allOf:
        - { $ref: "#/components/schemas/UsageCounts" }
        - type: object
          properties:
            organization_id: { type: [string, "null"] }
            account_id: { type: [string, "null"] }
            organization_name: { type: [string, "null"] }
            account_name: { type: [string, "null"] }
            organization_archived: { type: boolean }
            account_deleted: { type: boolean }
    UsagePage:
      type: object
      required: [scope, group_by, from, to, to_exclusive, rows, totals, total_count, page, per_page, coverage_start]
      properties:
        scope: { type: string, enum: [global, organization, account] }
        group_by: { type: string, enum: [organization, account] }
        from: { type: string, format: date }
        to: { type: string, format: date }
        to_exclusive: { type: string, format: date }
        rows: { type: array, items: { $ref: "#/components/schemas/UsageRow" } }
        totals: { $ref: "#/components/schemas/UsageCounts" }
        total_count: { type: integer, minimum: 0 }
        page: { type: integer, minimum: 1 }
        per_page: { type: integer, minimum: 1 }
        coverage_start: { type: [string, "null"], format: date-time }
